<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nailong Admin</title>
<meta name="theme-color" content="#FFD84D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EC;--panel:#FFFDF8;--ink:#4A3F4F;--mute:#8C7F92;--pink:#FFD6E4;--lav:#E3D9FF;--yel:#FFE98A;--blue:#D3EBFF;--peach:#FFE0CC;--line:#F1E6D8;--acc:#F79BB8;--accink:#7A2E4B;--shadow:0 6px 18px rgba(180,140,160,.18);--in:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A2330;--panel:#352D3C;--ink:#F6EEF8;--mute:#BDB0C4;--pink:#5A3447;--lav:#42386A;--yel:#5E5320;--blue:#2F4760;--peach:#5C4033;--line:#463C4F;--acc:#F79BB8;--accink:#FFD6E4;--shadow:0 6px 18px rgba(0,0,0,.35);--in:#2A2330}}
:root[data-theme="dark"]{--bg:#2A2330;--panel:#352D3C;--ink:#F6EEF8;--mute:#BDB0C4;--pink:#5A3447;--lav:#42386A;--yel:#5E5320;--blue:#2F4760;--peach:#5C4033;--line:#463C4F;--acc:#F79BB8;--accink:#FFD6E4;--shadow:0 6px 18px rgba(0,0,0,.35);--in:#2A2330}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Nunito,"Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,"Segoe UI Rounded","Trebuchet MS",sans-serif;font-weight:600;margin:0}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:2px dashed var(--line);padding:18px 14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px;font:600 20px Fredoka,sans-serif}
nav small{display:block;margin:14px 8px 4px;color:var(--mute);font-weight:700;font-size:12px}
nav button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:600 14px Nunito,sans-serif;padding:8px 10px;border-radius:14px;cursor:pointer;text-align:left}
nav button:hover{background:var(--lav)}nav button.on{background:var(--pink)}
nav button.soon{opacity:.55}nav .tag{margin-left:auto;font-size:10px;background:var(--yel);padding:1px 7px;border-radius:99px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding:28px 32px;max-width:1000px;width:100%}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--panel);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat b{display:block;font:600 24px Fredoka,sans-serif;margin-top:2px}.stat span{color:var(--mute);font-size:13px}
.ico{font-size:22px}
.btn{border:0;border-radius:99px;padding:9px 18px;font:700 14px Nunito,sans-serif;cursor:pointer;background:var(--acc);color:#4B1630}
.btn.ghost{background:var(--lav);color:var(--ink)}.btn.sm{padding:4px 12px;font-size:13px}
.btn:active{transform:scale(.96)}
input,select,textarea{width:100%;border:2px solid var(--line);background:var(--in);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar select,.bar input{width:auto}
.tw{overflow-x:auto;border-radius:18px}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--lav);font-weight:700;font-size:13px}td.n,th.n{text-align:right}
.in{color:#2E8B57}.out{color:#C2410C}
.empty{text-align:center;padding:36px 12px;color:var(--mute)}
dialog{border:0;border-radius:24px;padding:22px;width:min(420px,92vw);background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(74,63,79,.4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hello{display:flex;align-items:center;gap:18px;background:var(--yel);margin-bottom:16px}
.hello svg{flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.note{font-size:13px;color:var(--mute);margin-top:14px}
textarea{resize:vertical}
dialog{max-height:92vh;overflow:auto}dialog.w{width:min(680px,94vw)}
.it{display:grid;grid-template-columns:2fr 2fr 70px 80px auto;gap:6px;margin-bottom:6px}
.rm{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--bg);color:var(--ink);font:inherit;padding:9px 12px;border-radius:14px;cursor:pointer;text-align:left;margin-bottom:6px}
@media (max-width:600px){.it{grid-template-columns:1fr 1fr}}
#c3{position:fixed;bottom:0;left:240px;width:calc(100% - 240px);height:170px;pointer-events:none;z-index:1}#toast{z-index:10}#main{padding-bottom:170px}
@media (max-width:820px){#c3{left:0;width:100%;height:130px}#main{padding-bottom:140px}}
@media (prefers-reduced-motion:reduce){.hello svg{animation:none}#toast{transition:none}}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;max-height:none;border-right:0;border-bottom:2px dashed var(--line)}main{padding:18px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const MN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const rp=n=>"Rp "+new Intl.NumberFormat("id-ID").format(Math.round(n||0));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date();
let page="dash",fm=now.getMonth(),fy=now.getFullYear();
const D={petty:[],emoney:[],po:[],tugas:[],service:[],pajak:[],aktiva:[],perl:[],log:[]};
const NAV=[["MAIN MENU",[["dash","🏠","Dashboard"],["petty","👛","Petty Cash"],["emoney","🚗","E-Money Mobil"],["po","📦","Purchase Order"],["tugas","📋","Tugas Tambahan"]]],
["VEHICLE MANAGEMENT",[["service","🔧","Service Kendaraan"],["pajak","🧾","Pajak Kendaraan"]]],
["OFFICE MANAGEMENT",[["aktiva","🏢","Aktiva Tetap"],["perl","🖇️","Perlengkapan Kantor"],["log","📝","Catatan Pemeliharaan"]]],
["REPORTING",[["lap","📊","Report Center"]]],
["SETTINGS",[["imp","📥","Import dan Export"]]]];

/* ---------- storage: IndexedDB, falls back to memory ---------- */
let db=null,persist=true;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open("nailong-admin",4);
r.onupgradeneeded=()=>{for(const s of Object.keys(D))if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:"id"});if(r.result.objectStoreNames.contains("rotol"))r.result.deleteObjectStore("rotol")};
r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>{persist=false;res()}}catch(e){persist=false;res()}})}
const tx=(s,m)=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function loadAll(){if(!db)return;for(const s of Object.keys(D)){try{D[s]=await req(tx(s,"readonly").getAll())}catch(e){persist=false}}}
async function save(s,o){o.updatedAt=Date.now();o.synced=false;const i=D[s].findIndex(x=>x.id===o.id);i<0?D[s].push(o):D[s][i]=o;
if(db)try{await req(tx(s,"readwrite").put(o))}catch(e){toast("Gagal menyimpan ke penyimpanan lokal")}}
async function remove(s,id){D[s]=D[s].filter(x=>x.id!==id);if(db)try{await req(tx(s,"readwrite").delete(id))}catch(e){}}
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);

/* ---------- ui helpers ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2200)}
function dialog(html){const d=$("#dlg");d.className="";d.innerHTML=html;d.showModal();return d}
function confirmDel(msg,fn){dialog(`<h3>Hapus data?</h3><p>${msg}</p><div class="acts"><button class="btn ghost" onclick="$('#dlg').close()">Batal</button><button class="btn" id="yes">Ya, hapus</button></div>`);
$("#yes").onclick=async()=>{await fn();$("#dlg").close();toast("Data dihapus");render()}}
function mascot(s=96){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="60" rx="34" ry="32" fill="#FFD84D"/><ellipse cx="50" cy="68" rx="20" ry="19" fill="#FFF0A8"/><path d="M40 29l5-10 5 10zM52 27l5-10 5 11z" fill="#FFC21F"/><circle cx="38" cy="52" r="6" fill="#4A3F4F"/><circle cx="62" cy="52" r="6" fill="#4A3F4F"/><circle cx="40" cy="50" r="2" fill="#fff"/><circle cx="64" cy="50" r="2" fill="#fff"/><ellipse cx="29" cy="62" rx="5" ry="3" fill="#FFB3C7"/><ellipse cx="71" cy="62" rx="5" ry="3" fill="#FFB3C7"/><path d="M44 62q6 6 12 0" stroke="#4A3F4F" stroke-width="2.5" fill="none" stroke-linecap="round"/><ellipse cx="18" cy="68" rx="7" ry="5" fill="#FFD84D"/><ellipse cx="82" cy="68" rx="7" ry="5" fill="#FFD84D"/><ellipse cx="38" cy="92" rx="9" ry="5" fill="#FFC21F"/><ellipse cx="62" cy="92" rx="9" ry="5" fill="#FFC21F"/></svg>`}
const yearOpts=()=>{let o="";for(let y=now.getFullYear()+1;y>=now.getFullYear()-6;y--)o+=`<option ${y==fy?"selected":""}>${y}</option>`;return o};
const monthOpts=(all)=>(all?`<option value="-1">Semua bulan</option>`:"")+MN.map((m,i)=>`<option value="${i}" ${i==fm?"selected":""}>${m}</option>`).join("");

/* ---------- navigation ---------- */
function drawNav(){$("#nav").innerHTML=`<div class="brand">${mascot(36)} Nailong Admin</div>`+NAV.map(([g,items])=>`<small>${g}</small>`+items.map(([k,i,t,tag])=>`<button class="${page==k?"on":""} ${tag?"soon":""}" onclick="go('${k}')"><span class="ico">${i}</span>${t}${tag?`<span class="tag">${tag}</span>`:""}</button>`).join("")).join("")}
function go(p){page=p;render()}
function render(){drawNav();const m=$("#main");
if(page=="dash")m.innerHTML=dash();else if(page=="petty")m.innerHTML=petty();else if(page=="emoney")m.innerHTML=monthly(page);else if(page=="po")m.innerHTML=poPage();else if(page=="aktiva")m.innerHTML=aktPage();else if(G[page])m.innerHTML=gen(page);else if(page=="lap")m.innerHTML=lapPage();else if(page=="imp")m.innerHTML=impPage();else if(page=="sync")m.innerHTML=syncPage();
else{const it=NAV.flatMap(g=>g[1]).find(x=>x[0]==page);m.innerHTML=`<div class="card empty"><div style="font-size:48px">${it[1]}</div><h2>${it[2]}</h2><p>Modul ini belum dibuat dan dijadwalkan di ${it[3]}.</p></div>`}
exportBtn();window.scrollTo(0,0);if(window.charGo)charGo(page)}

/* ---------- dashboard ---------- */
function pettySummary(m,y){const rows=D.petty.filter(r=>+r.date.slice(5,7)-1==m&&+r.date.slice(0,4)==y);
const ci=rows.reduce((a,r)=>a+(+r.cin||0),0),co=rows.reduce((a,r)=>a+(+r.cout||0),0);
const bal=D.petty.reduce((a,r)=>a+(+r.cin||0)-(+r.cout||0),0);return{ci,co,bal}}
function startBal(s){const r=D[s].find(x=>x.m==now.getMonth()&&x.y==now.getFullYear());return r?rp(r.saldo):"Belum diisi"}
function dash(){const p=pettySummary(now.getMonth(),now.getFullYear());
return `<div class="card hello">${mascot(88)}<div><h1>Halo! Hari ini ${now.getDate()} ${MN[now.getMonth()]} ${now.getFullYear()}</h1><p style="margin:4px 0 0">Mulai dari mencatat Petty Cash, ya.</p></div></div>
<div class="grid">
<div class="card stat" style="background:var(--blue)"><span>👛 Cash In bulan ini</span><b class="in">${rp(p.ci)}</b></div>
<div class="card stat" style="background:var(--peach)"><span>💸 Cash Out bulan ini</span><b class="out">${rp(p.co)}</b></div>
<div class="card stat" style="background:var(--pink)"><span>💖 Saldo Petty Cash</span><b>${rp(p.bal)}</b></div>
<div class="card stat" style="background:var(--lav)"><span>🚗 Saldo awal E-Money</span><b>${startBal("emoney")}</b></div>
</div>
${dash2()}
${persist?"":`<p class="note">Penyimpanan lokal tidak tersedia di browser ini, jadi data hilang saat halaman ditutup.</p>`}`}

/* ---------- petty cash ---------- */
function petty(){const all=[...D.petty].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt-b.createdAt);let bal=0;
const withBal=all.map(r=>({...r,bal:(bal+=(+r.cin||0)-(+r.cout||0))}));
const rows=withBal.filter(r=>+r.date.slice(0,4)==fy&&(fm<0||+r.date.slice(5,7)-1==fm));
const ci=rows.reduce((a,r)=>a+(+r.cin||0),0),co=rows.reduce((a,r)=>a+(+r.cout||0),0);
return `<div class="head"><h1>👛 Petty Cash</h1><button class="btn" onclick="pForm()">+ Tambah transaksi</button></div>
<div class="bar"><select onchange="fm=+this.value;render()">${monthOpts(1)}</select><select onchange="fy=+this.value;render()">${yearOpts()}</select></div>
<div class="grid" style="margin-bottom:14px"><div class="card stat"><span>Total Cash In</span><b class="in">${rp(ci)}</b></div><div class="card stat"><span>Total Cash Out</span><b class="out">${rp(co)}</b></div><div class="card stat"><span>Saldo akhir</span><b>${rp(rows.length?rows[rows.length-1].bal:bal)}</b></div></div>
${rows.length?`<div class="tw"><table><tr><th>Tanggal</th><th>Keterangan</th><th class="n">Cash In</th><th class="n">Cash Out</th><th class="n">Saldo</th><th></th></tr>${rows.map(r=>`<tr><td>${r.date.split("-").reverse().join("/")}</td><td style="white-space:normal">${esc(r.ket)}</td><td class="n in">${r.cin?rp(r.cin):""}</td><td class="n out">${r.cout?rp(r.cout):""}</td><td class="n">${rp(r.bal)}</td><td><button class="btn ghost sm" onclick="pForm('${r.id}')">Edit</button> <button class="btn ghost sm" onclick="pDel('${r.id}')">Hapus</button></td></tr>`).join("")}</table></div>`:`<div class="card empty">${mascot(70)}<p>Belum ada transaksi di periode ini.</p></div>`}
<div class="card" style="margin-top:16px;background:var(--pink)"><h3>Ringkasan periode</h3><div class="grid" style="margin-top:10px"><div class="stat"><span>Total Cash In</span><b class="in">${rp(ci)}</b></div><div class="stat"><span>Total Cash Out</span><b class="out">${rp(co)}</b></div><div class="stat"><span>Pengeluaran Keseluruhan</span><b class="out">${rp(co)}</b></div><div class="stat"><span>Saldo Akhir</span><b>${rp(rows.length?rows[rows.length-1].bal:bal)}</b></div></div></div><p class="note">Saldo dihitung berurutan dari seluruh transaksi, jadi saldo awal bulan mengikuti bulan sebelumnya.</p>`}
function pForm(id){const r=D.petty.find(x=>x.id==id)||{date:iso(),ket:"",cin:"",cout:""};
dialog(`<h3>${id?"Edit":"Tambah"} transaksi</h3><label>Tanggal</label><input type="date" id="f1" value="${r.date}"><label>Keterangan</label><input id="f2" value="${esc(r.ket)}"><div class="row2"><div><label>Cash In</label><input type="number" min="0" id="f3" value="${r.cin}"></div><div><label>Cash Out</label><input type="number" min="0" id="f4" value="${r.cout}"></div></div><div class="acts"><button class="btn ghost" onclick="$('#dlg').close()">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
$("#ok").onclick=async()=>{const date=$("#f1").value,ket=$("#f2").value.trim(),cin=+$("#f3").value||0,cout=+$("#f4").value||0;
if(!date||!ket)return toast("Tanggal dan keterangan wajib diisi");if(!cin&&!cout)return toast("Isi Cash In atau Cash Out");if(cin&&cout)return toast("Isi salah satu saja: Cash In atau Cash Out");
await save("petty",{...r,id:r.id||uid(),createdAt:r.createdAt||Date.now(),date,ket,cin,cout});$("#dlg").close();toast("Tersimpan ✓");render()}}
function pDel(id){const r=D.petty.find(x=>x.id==id);confirmDel(`Transaksi "${esc(r.ket)}" akan dihapus.`,()=>remove("petty",id))}

/* ---------- e-money & ro tol (saldo awal bulanan) ---------- */
const MT={emoney:["🚗","E-Money Mobil"]};
function monthly(s){const rows=D[s].filter(r=>r.y==fy).sort((a,b)=>b.m-a.m);
return `<div class="head"><h1>${MT[s][0]} ${MT[s][1]}</h1><button class="btn" onclick="mForm('${s}')">+ Tambah saldo awal</button></div>
<div class="bar"><select onchange="fy=+this.value;render()">${yearOpts()}</select></div>
${rows.length?`<div class="tw"><table><tr><th>Bulan</th><th>Tahun</th><th class="n">Saldo awal</th><th>Keterangan</th><th></th></tr>${rows.map(r=>`<tr><td>${MN[r.m]}</td><td>${r.y}</td><td class="n">${rp(r.saldo)}</td><td style="white-space:normal">${esc(r.ket)}</td><td><button class="btn ghost sm" onclick="mForm('${s}','${r.id}')">Edit</button> <button class="btn ghost sm" onclick="mDel('${s}','${r.id}')">Hapus</button></td></tr>`).join("")}</table></div>`:`<div class="card empty">${mascot(70)}<p>Belum ada saldo awal untuk ${fy}.</p></div>`}`}
function mForm(s,id){const r=D[s].find(x=>x.id==id)||{m:now.getMonth(),y:fy,saldo:"",ket:""};
dialog(`<h3>${id?"Edit":"Tambah"} saldo awal ${MT[s][1]}</h3><div class="row2"><div><label>Bulan</label><select id="f1">${MN.map((m,i)=>`<option value="${i}" ${i==r.m?"selected":""}>${m}</option>`).join("")}</select></div><div><label>Tahun</label><input type="number" id="f2" value="${r.y}"></div></div><label>Saldo awal</label><input type="number" min="0" id="f3" value="${r.saldo}"><label>Keterangan</label><input id="f4" value="${esc(r.ket)}"><div class="acts"><button class="btn ghost" onclick="$('#dlg').close()">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
$("#ok").onclick=async()=>{const m=+$("#f1").value,y=+$("#f2").value,saldo=$("#f3").value;
if(!y||saldo==="")return toast("Tahun dan saldo awal wajib diisi");
if(D[s].some(x=>x.m==m&&x.y==y&&x.id!=r.id))return toast(`${MN[m]} ${y} sudah ada. Edit data yang lama.`);
await save(s,{...r,id:r.id||uid(),createdAt:r.createdAt||Date.now(),m,y,saldo:+saldo,ket:$("#f4").value.trim()});fy=y;$("#dlg").close();toast("Tersimpan ✓");render()}}
function mDel(s,id){const r=D[s].find(x=>x.id==id);confirmDel(`Saldo awal ${MN[r.m]} ${r.y} akan dihapus.`,()=>remove(s,id))}

/* ---------- Tahap 2-3: helpers ---------- */
const iso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dl=s=>s?Math.round((new Date(s+"T00:00:00")-new Date(iso()+"T00:00:00"))/864e5):null;
const fd=s=>s?s.split("-").reverse().join("/"):"-";
const BC={ok:"#BFEFD2",warn:"#FFE98A",bad:"#FFB4A8",neu:"#E3D9FF"};
const bd=(t,c)=>t?`<span style="background:${BC[c||"neu"]};color:#4A3F4F;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700">${esc(t)}</span>`:"";
const bf=x=>x?bd(x[0],x[1]):"";
function due(d,w,late){if(d==null)return null;if(d<0)return [late+" "+(-d)+" hari","bad"];if(d<=w)return [d==0?"Hari ini":"H-"+d,"warn"];return null}
const OPEN=["Menunggu kedatangan","Dalam proses"];
const poFlag=r=>OPEN.includes(r.status)?due(dl(r.eta),3,"Terlambat"):null;

/* ---------- modul generik: Tugas, Service, Pajak, Aktiva, Perlengkapan ---------- */
const G={
tugas:{t:"📋 Tugas Tambahan",a:"Tambah tugas",sk:"status",def:"Aktif",dk:"tgl",sort:["dl",1],

const MON={januari:0,jan:0,january:0,februari:1,feb:1,february:1,maret:2,mar:2,march:2,april:3,apr:3,mei:4,may:4,juni:5,jun:5,june:5,juli:6,jul:6,july:6,agustus:7,agu:7,aug:7,august:7,september:8,sep:8,oktober:9,okt:9,oct:9,october:9,november:10,nov:10,desember:11,des:11,dec:11,december:11};
function mk(y,m,d){const t=new Date(y,m,d);return t.getMonth()==m&&t.getDate()==d?y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"):null}
function pDate(v){if(v instanceof Date){if(isNaN(v))return null;v=new Date(v.getTime()+432e5);return mk(v.getFullYear(),v.getMonth(),v.getDate())}
v=String(v??"").trim();if(!v)return"";let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mk(+m[1],+m[2]-1,+m[3]);
m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(m)return mk(+m[3]<100?2000+ +m[3]:+m[3],+m[2]-1,+m[1]);
m=v.match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);if(m&&MON[m[2].toLowerCase()]!=null)return mk(+m[3],MON[m[2].toLowerCase()],+m[1]);return null}
const pNum=v=>{if(typeof v=="number")return v;const s=String(v??"").replace(/[^\d-]/g,"");return s===""||s=="-"?"":+s};

function csv(t){const L=t.split(/\r?\n/).filter(x=>x.trim()!=="");const d=["\t",";",","].find(x=>(L[0]||"").includes(x))||",";

function impBuild(s,raw){const K=IMP[s].k,low=x=>String(x??"").trim().toLowerCase();let rows=raw.filter(r=>r.some(c=>String(c??"").trim()!==""));
let idx=K.map((_,i)=>i);const h=rows[0]?rows[0].map(low):[];
const hm=K.map(([k,l])=>h.findIndex(x=>x.length>2&&(x==k||low(l).startsWith(x))));
if(hm.some(i=>i>=0)){idx=hm;rows=rows.slice(1)}
const dk=o=>s=="emoney"?o.m+"|"+o.y:s=="po"?o.no:K.map(([k])=>o[k]??"").join("|"),seen=new Set(D[s].map(s=="po"?r=>r.no:dk)),out=[];let prev="";
rows.forEach(r=>{const g=i=>i>=0?r[i]:"",o={},er=[];
if(s=="log"&&/^\d{4}$/.test(String(g(idx[0])).trim())&&!String(g(idx[1])??"").trim())return;
K.forEach(([k,l,t,rq,op],j)=>{let v=g(idx[j]);if(typeof v=="string")v=v.trim();
if(t=="date"){let d=pDate(v);if(s=="log"&&j==0){if(d==="")d=prev;else if(d)prev=d}if(d===null)er.push(l+" tidak valid");v=d}
else if(t=="num"||t=="rp")v=pNum(v);
else if(t=="month"){const x=low(v),b=/^\d+$/.test(x)?+x-1:MON[x];if(b==null||b<0||b>11)er.push("Bulan tidak valid");v=b}
else if(t=="sel"){if(v===""||v==null)v=op[0];else{const f=op.find(z=>low(z)==low(v));if(!f)er.push(l+" tidak dikenal");v=f}}
else v=String(v??"").trim();
if(rq&&(v===""||v==null)&&!er.length)er.push(l+" wajib diisi");o[k]=v});
if(s=="log")o.kat=katOf(o.ket)||(idx[2]<0?"Lainnya":o.kat);

work:t=>({aLx:-1.2+Math.sin(t*13)*.2,aRx:-1.2+Math.cos(t*13)*.2,aLz:.3,aRz:-.3,hx:.3,sq:br(t),bk:bk(t)}),
happy:t=>({aLz:-2.6,aRz:2.6,jp:Math.abs(Math.sin(t*6))*30,sq:1+Math.sin(t*12)*.04,bk:.15}),
sleep:t=>({hx:.5,hz:.15,bk:.08,sq:1+Math.sin(t*1.3)*.03,aLz:-.1,aRz:.1}),
sit:t=>({sit:1,hz:Math.sin(t*1.1)*.05,sq:br(t),bk:bk(t)})};
let minX=-300,maxX=300,dir=1,wv=0,el=0;const clk=new THREE.Clock();
function resize(){const W=cv.clientWidth||600,H=cv.clientHeight||170;ren.setSize(W,H,false);cam.left=-W/2;cam.right=W/2;cam.top=H;cam.bottom=0;cam.updateProjectionMatrix();minX=-W/2+60;maxX=W/2-60;root.position.x=Math.min(Math.max(root.position.x,minX),maxX)}
function frame(snap){const dt=Math.min(clk.getDelta(),.05),now=Date.now();el+=dt;
if(!(OV&&OV.st=="sleep")&&now-last>60000)OV={st:"sleep",u:Infinity};
let st=OV&&now<OV.u?OV.st:base;
if(st=="walk"){if(now<wv)st="wave";else{root.position.x+=dir*45*dt;if(root.position.x>maxX||root.position.x<minX){root.position.x=Math.min(Math.max(root.position.x,minX),maxX);dir=-dir;wv=now+1800}}}
const tg={...D0,...SP[st](el)};
if(prop&&["idle","greet","sleep"].includes(st)){if(prop=="box"){tg.aLx=tg.aRx=-1.2;tg.aLz=.5;tg.aRz=-.5}else{tg.aRx=-.9;tg.aRz=-.3}}
const k=snap?1:Math.min(1,dt*9);for(const n of KS)P[n]+=(tg[n]-P[n])*k;
aL.rotation.set(P.aLx,0,P.aLz);aR.rotation.set(P.aRx,0,P.aRz);lL.rotation.x=P.lL;lR.rotation.x=P.lR;hd.rotation.set(P.hx,0,P.hz);
bd.scale.y=P.sq;bd.rotation.z=P.tl;bd.position.y=50-12*P.sit+P.jp;
for(const l of [lL,lR]){l.position.y=-34+12*P.sit;l.position.z=4+22*P.sit}
eyes.forEach(e=>e.scale.y=P.bk);box.visible=prop=="box";clip.visible=prop=="clip";
const ry=st=="walk"?dir*1:st=="wave"?0:-.25;root.rotation.y+=(ry-root.rotation.y)*(snap?1:Math.min(1,dt*6));
ren.render(sc,cam)}
api={go(p){const c=CH[p]||{s:"idle"};base=c.s;prop=c.p||"";if(base!="walk")root.position.x=maxX-40;OV={st:"greet",u:Date.now()+2200};if(RM)frame(true)},ev(s,sec){OV={st:s,u:Date.now()+sec*1000};if(RM)frame(true)}};
window.charGo=api.go;window.charEv=api.ev;addEventListener("resize",resize);resize();api.go(page);
if(!RM)(function loop(){requestAnimationFrame(loop);frame()})()
}catch(e){}}
